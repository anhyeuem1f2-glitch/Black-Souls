<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BLACK SOULS production card smoke</title>
  <style>html,body{width:100%;height:100%;margin:0;background:#000}</style>
</head>
<body>
  <script type="module">
    const card = await fetch('/deliverables/Black_Souls_ST.json', { cache: 'no-store' }).then((response) => {
      if (!response.ok) throw new Error(`Card HTTP ${response.status}`);
      return response.json();
    });
    const characterScript = card.data.extensions.tavern_helper.scripts.find((entry) => entry.enabled && entry.type === 'script');
    if (!characterScript) throw new Error('Enabled TavernHelper script missing.');
    const script = document.createElement('script');
    script.textContent = characterScript.content;
    document.body.append(script);
  </script>
</body>
</html>
